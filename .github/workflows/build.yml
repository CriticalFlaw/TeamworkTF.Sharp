name: Build, Test, Publish
on: [push, pull_request, workflow_dispatch]
jobs:
  main:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    - name: Setup
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Build
      run: dotnet build ./src/TeamworkTF.Sharp.sln --configuration Release
    - name: Test
      env:
        teamworkTf: ${{ secrets.TOKEN_TEAMWORKTF }}
        steam: ${{ secrets.TOKEN_STEAM }}
      run: dotnet test ./src/TeamworkTF.Test/TeamworkTF.Test.csproj --configuration Release --no-build
    - name: Publish
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: dotnet nuget push "./src/TeamworkTF.Sharp/bin/Release/*.nupkg" --api-key "${{ secrets.TOKEN_NUGET }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
