name: Build, Test, Publish
on: [push, pull_request, workflow_dispatch]
jobs:
  main:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v5
    - name: Setup
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Build
      run: dotnet build ./src/TeamworkTF.Sharp.sln --configuration Release
    - name: Test
      env:
        teamworkTf: ${{ secrets.TOKEN_TEAMWORKTF }}
        steam: ${{ secrets.TOKEN_STEAM }}
      run: dotnet test ./src/TeamworkTF.Test/TeamworkTF.Test.csproj --configuration Release --no-build
    - name: NuGet Login
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Publish
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: |
        Get-ChildItem ./src/TeamworkTF.Sharp/bin/Release/*.nupkg | ForEach-Object {
          dotnet nuget push $_.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }